name: Build e Validação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2

      - name: Verificar importação do app
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from app import create_app
          app = create_app()
          print('App criado com sucesso!')
          print(f'Rotas registradas: {len(app.url_map.iter_rules())}')
          "

      - name: Verificar sintaxe
        run: |
          python -m py_compile run.py
          python -m py_compile config.py
          python -m py_compile app/models.py
          python -m py_compile app/forms.py
          echo "Sintaxe OK!"
